<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Aplikasi Al-Ma'tsurat Hasan Al-Banna untuk bacaan Wazifah Sugro." />
  <meta name="theme-color" content="#1A3A6B" />
  <title>Al-Ma'tsurat Hasan Al-Banna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#mainContent">Lewati ke konten utama</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#wazifah" aria-label="Buka Wazifah Sugro Al-Ma'tsurat Hasan Al-Banna">
        <span class="brand-mark" aria-hidden="true">م</span>
        <span>
          <strong>Al-Ma'tsurat</strong>
          <small>Hasan Al-Banna</small>
        </span>
      </a>

      <nav class="top-nav" aria-label="Navigasi utama">
        <a href="#wazifah" data-nav-link="wazifah">Wazifah Sugro</a>
      </nav>
    </div>
  </header>

  <main id="mainContent" class="main-content">
    <section id="homeView" class="view view-home" aria-labelledby="homeTitle">
      <div class="container hero">
        <div class="hero-copy">
          <p class="eyebrow hero-badge">DOA PAGI DAN PETANG</p>
          <h1 id="homeTitle">WAZIFAH SUGRO</h1>
          <p class="hero-description">
            Aplikasi Al-Ma'tsurat Hasan Al-Banna untuk bacaan Wazifah Sugro.
          </p>
          <div class="hero-actions" aria-label="Pilihan bacaan utama">
            <a class="btn btn-primary" href="#wazifah">Mulai Wazifah Sugro</a>
          </div>
        </div>

      </div>
    </section>

    <section id="readerView" class="view view-reader" hidden>
      <div class="container">
        <div class="reader-head">
          <div>
            <p class="eyebrow" id="readerEyebrow">Bacaan</p>
            <h1 id="readerTitle">Wazifah Sugro</h1>
            <p id="readerDescription" class="reader-description"></p>
          </div>
          <div class="reader-actions">
            <span id="progressText" class="progress-pill" aria-live="polite">0 / 0 selesai</span>
            <button class="btn btn-ghost" id="resetCountersBtn" type="button">Reset Counter</button>
            <button class="btn btn-ghost" id="printBtn" type="button">Cetak</button>
          </div>
        </div>

        <section class="settings-panel" aria-label="Pengaturan tampilan">
          <div class="field-group">
            <label for="fontSizeSelect">Ukuran font</label>
            <select id="fontSizeSelect">
              <option value="small">Kecil</option>
              <option value="medium">Sedang</option>
              <option value="large">Besar</option>
            </select>
          </div>

          <div class="field-group">
            <label for="displayModeSelect">Tampilan bacaan</label>
            <select id="displayModeSelect">
              <option value="arab-only">Arab saja</option>
              <option value="arab-translation">Arab + arti</option>
            </select>
          </div>

          <div class="field-group toggle-row">
            <span>Mode gelap</span>
            <button id="themeToggle" class="toggle" type="button" aria-pressed="false" aria-label="Aktifkan atau nonaktifkan mode gelap">
              <span class="toggle-thumb"></span>
            </button>
          </div>
        </section>

        <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
        <div id="prayerList" class="prayer-list" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Al-Ma'tsurat Hasan Al-Banna</span>
      <span>Dibuat untuk GitHub Pages</span>
    </div>
  </footer>

  <noscript>
    <div class="noscript">Aplikasi ini membutuhkan JavaScript untuk menampilkan data bacaan.</div>
  </noscript>

  <script src="js/app.js" defer></script>
</body>
</html>
